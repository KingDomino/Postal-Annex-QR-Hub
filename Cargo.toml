[package]
name = "postal-annex-qr-scanner"
version = "2.0.1"
edition = "2021"
description = "PostalAnnex+ Amazon QR Code Scanner"

[lib]
name = "postal_annex_qr_scanner"
path = "src/lib.rs"

[[bin]]
name = "PostalAnnexQRScanner"
path = "src/main.rs"

[features]
default = ["online-updater"]
online-updater = ["dep:reqwest"]

[dependencies]
eframe = "0.31"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
semver = "1.0"
sha2 = "0.10"
self-replace = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
arboard = "3.4"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
